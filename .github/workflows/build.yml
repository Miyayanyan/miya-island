name: Build

on:
  push:
    branches: [ main, "claude/**", "gpt/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "要发布的正式版标签，例如 v0.7.0（留空就只构建）"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MiyaIsland.csproj -c Release -nologo

      - name: Test
        if: hashFiles('tests/**/*.csproj') != ''
        shell: pwsh
        run: Get-ChildItem tests -Recurse -Filter *.csproj | ForEach-Object { dotnet test $_.FullName -c Release -nologo; if ($LASTEXITCODE) { exit $LASTEXITCODE } }

      # 用真实歌曲测一下在线歌词命中率，只打印结果，不影响构建
      - name: Lyric probe
        continue-on-error: true
        shell: pwsh
        env:
          LYRIC_PROBE: "1"
        run: dotnet test tests/MiyaIsland.Core.Tests -c Release -nologo --filter "FullyQualifiedName~LiveProbe" --logger "console;verbosity=detailed"

      # 只为 Claude 的开发分支生成可直接双击运行的预览版，放在固定的 Release 页面上
      - name: Publish preview exe
        if: (github.event_name == 'push' && (startsWith(github.ref_name, 'claude/') || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        run: dotnet publish MiyaIsland.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish -nologo

      - name: Update preview release
        if: github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          Copy-Item publish/MiyaIsland.exe MiyaIsland-v0.7-preview.exe
          $short = "${{ github.sha }}".Substring(0, 7)
          $title = ($env:HEAD_MSG -split "`n")[0]
          $time = (Get-Date).ToUniversalTime().AddHours(8).ToString("yyyy-MM-dd HH:mm")
          $notes = @"
          测试用预览版，不是正式版本。

          - 代码版本：$short（$time，北京时间）
          - 用法：下载下面的 MiyaIsland-v0.7-preview.exe，先退出正在运行的旧版小岛，再双击打开。
          - 如果 Windows 提示“已保护你的电脑”，点“更多信息”→“仍要运行”。
          - 设置和提醒数据与旧版共用，不会丢。

          最新提交：$title
          "@
          gh release delete v0.7-preview --cleanup-tag --yes 2>$null
          gh release create v0.7-preview MiyaIsland-v0.7-preview.exe --prerelease --target ${{ github.sha }} --title "Miya Island v0.7 预览版（测试用）" --notes $notes

      # 发布正式版：推送 v 开头的标签，或者手动运行工作流并填写 release（例如 v0.7.0）
      - name: Create release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release || github.ref_name }}
        run: |
          Copy-Item publish/MiyaIsland.exe MiyaIsland.exe
          Copy-Item 先看这里.txt ReadMe.txt  # GitHub 会把中文附件名改成 default.txt
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "标签格式不对：$tag" }
          $notes = Get-Content "docs/release-notes/$tag.md" -Raw -Encoding utf8 -ErrorAction SilentlyContinue
          if (-not $notes) { $notes = "Miya Island $tag" }
          gh release create $tag MiyaIsland.exe "ReadMe.txt#使用说明" --target ${{ github.sha }} --title "Miya Island $tag" --notes $notes
